# Inference of one sample with one forecast step (+6h), e.g. to check that a trained run
# works. The period is covered by all datasets of the JSC data catalog: Metop-C IASI ends on
# 2023-05-31 and Metop-A IASI in 2021.

data_loading:
  # each worker reads the data for its samples
  num_workers_validation: 1

test_config:
  samples_per_mini_epoch: 1
  start_date: "2023-03-01T00:00"
  end_date: "2023-03-02T00:00"
  forecast:
    num_steps: 1
  output:
    num_samples: 1
